<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RCI Engineering, Inc.</title>
<meta name="description" content="Mechanical, electrical, plumbing and fire protection engineering design. Davie, Florida.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='5' r='5' fill='%23215B33'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: pure white. Chrome drafting tools draw three stacked layers of a real RCI sheet, the sheets
   turn into 3D, render in clay, break into particles and the particles become the logo, which floats and follows the cursor.
   At rest: a slim centered nav, the logo centered, the hero block centered beneath it. */
:root{
  --paper:#FFFFFF; --ink:#1F2421; --ink-2:#666C68; --rule:#E3E6E4;
  --dark:#215B33; --dark-press:#163C22; --lite:#1EB53A;
  --l1:#D5D9D6; --l2:#A3AAA6; --l3:#5F6763;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pill:999px; --r:12px; --r-sm:6px; --r-xs:8px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:relative;height:100%;min-height:600px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* slim nav, centered, Apple-like */
.bar{position:absolute;z-index:30;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);
  background:rgba(255,255,255,.78);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--rule);opacity:0;transform:translateY(-8px);transition:opacity 700ms ease-out,transform 700ms cubic-bezier(.2,.7,.2,1)}
.bar .row{height:36px;display:flex;align-items:center;justify-content:center;gap:clamp(18px,3vw,40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;letter-spacing:.01em}
.bar a{color:var(--ink);text-decoration:none;opacity:.82;transition:opacity 150ms ease-out}
.bar a:hover{opacity:1}
.bar .mark{display:block;width:17px;height:17px;opacity:1}
.bar .mark svg{width:100%;height:100%;display:block}
.bar a:focus-visible,.btn:focus-visible,.skip:focus-visible,#sample button:focus-visible{outline:2px solid var(--dark);outline-offset:3px;border-radius:6px}
@media (max-width:720px){.bar .links a:not(.keep){display:none}}
.links{display:contents}
.bar .navbtn{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:var(--r-sm);background:var(--dark);color:#fff;opacity:1;font-weight:500;transition:background-color 150ms ease-out}
.bar .navbtn:hover{background:var(--dark-press)}
.done .bar{opacity:1;transform:none}

/* the real logo, centered */
#logo{position:absolute;z-index:10;left:0;top:0;opacity:0;perspective:1400px}
#logo .float{position:relative;transform-style:preserve-3d;will-change:transform}
#logo svg{display:block;width:100%;height:auto;overflow:visible}
#logo .depth{position:absolute;left:0;top:0;width:100%;height:auto}

/* hero block */
.block{position:absolute;z-index:12;left:0;right:0;display:grid;justify-items:center;gap:18px;text-align:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.block > *{opacity:0;transform:translateY(12px);transition:opacity 800ms ease-out,transform 1000ms cubic-bezier(.2,.7,.2,1)}
.done .block > *{opacity:1;transform:none}
.done .block > *:nth-child(2){transition-delay:120ms}.done .block > *:nth-child(3){transition-delay:240ms}
h1{margin:0;font-weight:600;letter-spacing:-0.035em;line-height:1.02;font-size:clamp(1.9rem,3.4vw,3.1rem);max-width:18em;text-wrap:balance}
.detail{margin:0;color:var(--ink-2);font-size:clamp(.95rem,1.15vw,1.08rem);letter-spacing:.005em}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:var(--r);font:500 15px/1 var(--sans);text-decoration:none;
  border:1px solid var(--dark);transition:background-color 150ms ease-out,color 150ms ease-out,border-color 150ms ease-out}
.btn.fill{background:var(--dark);color:#fff}
.btn.fill:hover{background:var(--dark-press);border-color:var(--dark-press)}
.btn.line{background:transparent;color:var(--dark)}
.btn.line:hover{background:var(--dark);color:#fff}

/* drafting captions */
.cap{position:absolute;z-index:8;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;
  font:500 12px/1.4 var(--mono);letter-spacing:.02em;color:var(--ink-2);transition:opacity 400ms ease-out}
.cap b{color:var(--ink);font-weight:600}
.cap .c::after{content:"";display:inline-block;width:7px;height:13px;margin-left:3px;vertical-align:-2px;background:var(--ink);animation:caret 1s steps(1) infinite}
.cap .l{font-size:11px;opacity:.8}
@keyframes caret{50%{opacity:0}}
.done .cap{opacity:0}
.skip{position:absolute;z-index:40;right:max(24px,env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));
  font:500 12px/1 var(--sans);color:var(--ink-2);background:rgba(255,255,255,.7);border:1px solid var(--rule);border-radius:var(--r-xs);padding:9px 14px;cursor:pointer;transition:opacity 300ms ease-out}
.done .skip{opacity:0;pointer-events:none}

/* sample tag: internal, not part of the design */
#sample{position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:rgba(20,24,22,.86);color:#fff;
  font:500 12px/1.2 var(--sans);border-radius:999px}
#sample .n{opacity:.6}
#sample button{font:inherit;color:#14181a;background:#fff;border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
@media (max-width:520px){#sample .t{display:none}}
@media (prefers-reduced-motion:reduce){.bar,.block > *,.cap,.skip{transition:none}}
</style>

</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <nav class="bar" aria-label="Main"><div class="row">
    <a class="mark" href="#" id="navmark" aria-label="RCI Engineering, Inc. home"></a>
    <span class="links"><a href="#">About</a><a href="#">Services</a><a href="#" class="keep">Projects</a><a href="#">Team</a><a href="#">Careers</a></span><a href="#" class="navbtn keep">Contact</a>
  </div></nav>
  <div id="logo" role="img" aria-label="RCI Engineering, Inc."></div>
  <section class="block" id="block">
    <h1>MEP engineering designed around the architecture.</h1>
    <p class="detail">Mechanical · Electrical · Plumbing · Fire protection · Commissioning</p>
    <div class="actions"><a class="btn fill" href="#">See the projects</a><a class="btn line" href="#">Meet the studios</a></div>
  </section>
  <div class="cap" id="cap" aria-hidden="true"></div>
  <button type="button" class="skip" id="skip">Skip intro</button>
</div>

    var Q=[],cs=Math.cos(cam.spin),sn=Math.sin(cam.spin);
    for(var i=0;i<SEGS.length;i++){var g=SEGS[i],zb=lz(g.L)+(g.L===1?hw*0.55:0),zt=zb+(g.L===0?hw:hd);
      var a0=proj(wx(g.x0),wy(g.y0),zb,[0,0,0]),a1=proj(wx(g.x1),wy(g.y1),zb,[0,0,0]),b1=proj(wx(g.x1),wy(g.y1),zt,[0,0,0]),b0=proj(wx(g.x0),wy(g.y0),zt,[0,0,0]);
      var nx=-(g.y1-g.y0)/g.l,ny=(g.x1-g.x0)/g.l,rx=nx*cs-ny*sn,ry=nx*sn+ny*cs,lit=Math.abs(rx*-0.55+ry*-0.83);
      Q.push({p:[a0,a1,b1,b0],k:(a0[2]+a1[2]+b1[2]+b0[2])/4,L:g.L,lit:lit});}
    Q.sort(function(a,b){return a.k-b.k;});
    ctx.lineWidth=0.6;ctx.strokeStyle='rgba(31,36,33,.22)';
    for(i=0;i<Q.length;i++){var o=Q[i],v=o.L===0?Math.round(214+34*o.lit):Math.round(176+40*o.lit);
      ctx.fillStyle='rgb('+v+','+(v+2)+','+(v+1)+')';ctx.beginPath();ctx.moveTo(o.p[0][0],o.p[0][1]);ctx.lineTo(o.p[1][0],o.p[1][1]);ctx.lineTo(o.p[2][0],o.p[2][1]);ctx.lineTo(o.p[3][0],o.p[3][1]);ctx.closePath();ctx.fill();ctx.stroke();}}
  ctx.restore();
  /* buckets being rendered right now */
  ctx.save();ctx.strokeStyle='rgba(31,36,33,.6)';ctx.lineWidth=1;TILES.forEach(function(tl){if(t<tl.t-200||t>=tl.t)return;var c=9,x=tl.x+2,y=tl.y+2,w=tl.w-4,h=tl.h-4;
    ctx.beginPath();ctx.moveTo(x,y+c);ctx.lineTo(x,y);ctx.lineTo(x+c,y);ctx.moveTo(x+w-c,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+c);ctx.moveTo(x+w,y+h-c);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-c,y+h);ctx.moveTo(x+c,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-c);ctx.stroke();});ctx.restore();
  /* the moment it completes: a soft flash */
}

/* ---------- the timeline ---------- */
var TOTAL=10600;
var CMDS=[[300,'LINE','A-WALL'],[1550,'PLINE','M-HVAC-DUCT'],[2900,'INSERT','M-HVAC-EQPM'],[3200,'CIRCLE','M-HVAC-EQPM'],[4300,'SELECT','All layers'],[4800,'3DORBIT','3 layers'],[5300,'RENDER','Clay'],[6750,'EXPLODE',''],[7700,'RCI','']];
function camera(t){var r=E.io5(seg(t,4800,6100));cam.tilt=r*0.98+E.io3(seg(t,6100,7200))*0.05;cam.spin=-r*0.5-E.io3(seg(t,6100,7300))*0.12;
  cam.sep=r*Math.min(H,W)*0.17*(1-E.io3(seg(t,6800,7800)));if(t>7450){var b=E.io3(seg(t,7450,8600));cam.tilt=lerp(cam.tilt,0,b);cam.spin=lerp(cam.spin,0,b);}}
function frame(t){
  camera(t);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  /* the drawing dissolves behind a soft front while its points drift away as dust */
  var fx=frontX(t),fw=W*0.08;
  if(t<=FRONT0){drawRender(t);drawLines(t,1);}
  else if(fx-fw<W){var main=ctx;ctx=bctx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);drawRender(t);drawLines(t,1);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='destination-in';var gr=ctx.createLinearGradient(fx-fw,0,fx+fw,0);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
    ctx=main;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(buf,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);}
  var ph=t/5200;
  /* ruler 1: vertical, sweeps left to right drawing the architecture */
  var a1=E.out3(seg(t,0,420))*(1-E.out3(seg(t,2750,3150)));if(a1>0){var sx=lerp(0,1,seg(t,350,2650))+0.012;proj(wx(sx*PLAN.w),0,lz(0),tmp);
    ruler(tmp[0]-20+(1-E.out3(seg(t,0,420)))*-160,H/2+(E.out3(seg(t,2750,3150)))*-H,H*1.3,mob?36:48,Math.PI/2,a1,ph);}
  /* ruler 2: horizontal, sweeps top to bottom drawing the ductwork */
  var a2=E.out3(seg(t,1250,1650))*(1-E.out3(seg(t,3850,4300)));if(a2>0){var sy=lerp(0,1,seg(t,1550,3750))+0.012;proj(0,wy(sy*PLAN.h),lz(1),tmp);
    ruler(W/2+(E.out3(seg(t,3850,4300)))*W,tmp[1]-20+(1-E.out3(seg(t,1250,1650)))*-140,W*1.3,mob?36:48,0,a2,ph+0.3);}
  /* compass: swings two circles of the device layer */
  compassAt.forEach(function(L,ci){var t0=3200+ci*700,ca=E.out3(seg(t,t0,t0+250))*(1-E.out3(seg(t,t0+650,t0+900)));if(ca<=0)return;
    proj(wx(L.cx),wy(L.cy),lz(2),tmp);var r=L.r*S*0.5;compass(tmp[0],tmp[1],Math.max(r,22),-Math.PI/2+E.io3(seg(t,t0+150,t0+650))*Math.PI*2,ca,ph);});
  /* the CAD cursor places the devices: snaps, grips and live coordinates */
  if(t>2700&&t<4350&&hops.length){var hp=clamp01((t-2900)/1500)*(hops.length-1),hi=Math.floor(hp),hf=E.io3(hp-hi),A=hops[hi],B=hops[Math.min(hi+1,hops.length-1)];
    var cxp=lerp(A.p[0],B.p[0],hf),cyp=lerp(A.p[1],B.p[1],hf);proj(wx(cxp),wy(cyp),lz(2),tmp);var ca2=E.out3(seg(t,2700,2950))*(1-seg(t,4150,4350));
    if(hf>0.85)snapMark(tmp[0],tmp[1],hi%3,ca2);
    lines.forEach(function(L){if(L.L!==2||t<L.s||t>L.s+420)return;var p=L.p;proj(wx(p[0]),wy(p[1]),lz(2),tmp2);grip(tmp2[0],tmp2[1],0.9);proj(wx(p[p.length-2]),wy(p[p.length-1]),lz(2),tmp2);grip(tmp2[0],tmp2[1],0.9);});
    crosshair(tmp[0],tmp[1],ca2,'X '+(cxp/2).toFixed(2)+'   Y '+((PLAN.h-cyp)/2).toFixed(2));}
  /* crossing selection: drag right to left over everything */
  if(t>4300&&t<4950){var sp=E.io3(seg(t,4300,4700)),x0=W*0.88,y0=H*0.84,x1=lerp(x0,W*0.1,sp),y1=lerp(y0,H*0.14,sp),sa=1-seg(t,4800,4950);
    ctx.save();ctx.globalAlpha=sa;ctx.fillStyle='rgba(30,181,58,.07)';ctx.fillRect(x1,y1,x0-x1,y0-y1);ctx.setLineDash([6,4]);ctx.strokeStyle='#1EB53A';ctx.lineWidth=1.2;ctx.strokeRect(x1,y1,x0-x1,y0-y1);ctx.restore();
    crosshair(x1,y1,sa,'Crossing selection');}
  viewCube(E.out3(seg(t,4800,5200))*(1-seg(t,7300,7700)));
  if(t>=FRONT0)drawParticles(t);
  /* real logo takes over */
  logoBox.style.opacity=E.out3(seg(t,9050,9550));
  MARK.forEach(function(k){G[k].forEach(function(g){g.style.opacity=1;});});
  var wi=0;WORD.forEach(function(k){G[k].forEach(function(g){var f=E.out5(seg(t,9250+wi*30,9850+wi*30));wi++;g.style.opacity=f;g.style.transform='translateX('+(1-f)*-8+'px)';});});
  sheen.setAttribute('x',lerp(-120,230,E.io3(seg(t,9900,10600))));DEPTH.forEach(function(d){d.style.opacity=E.out3(seg(t,9400,10000));});
  var c=null;CMDS.forEach(function(cp){if(t>=cp[0])c=cp;});var key=c?c[1]:'';
  if(cap._c!==key){cap._c=key;cap.innerHTML=c?'<span class="c">Command: <b>'+c[1]+'</b></span>'+(c[2]?'<span class="l">Layer: '+c[2]+'</span>':''):'';}
  if(t>9650)document.body.classList.add('done');
}

/* at rest: a faint dot field breathing behind the logo */
var resting=false;
var ptr={x:0,y:0,on:false},spr={rx:0,ry:0,tx:0,ty:0,vrx:0,vry:0,vtx:0,vty:0};
stage.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var r=stage.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.on=true;});
stage.addEventListener('pointerleave',function(){ptr.on=false;});
function floatStep(t){if(RCI.reduced){floatEl.style.transform='none';return;}
  var cx=LR.x+LR.w/2,cy=LR.y+LR.h/2,over=ptr.on&&ptr.x>LR.x&&ptr.x<LR.x+LR.w&&ptr.y>LR.y&&ptr.y<LR.y+LR.h;
  var dx=over?clamp01((ptr.x-LR.x)/LR.w)*2-1:0,dy=over?clamp01((ptr.y-LR.y)/LR.h)*2-1:0;
  var T={rx:-dy*5,ry:dx*7,tx:dx*LR.w*0.012,ty:dy*LR.h*0.04};
  ['rx','ry','tx','ty'].forEach(function(k){var v='v'+k;spr[v]=(spr[v]+(T[k]-spr[k])*0.16)*0.68;spr[k]+=spr[v];});
  var bob=Math.sin(t*1.3)*LR.h*0.03,sway=Math.sin(t*0.7)*0.45;
  floatEl.style.transform='translate3d('+spr.tx.toFixed(2)+'px,'+(spr.ty+bob).toFixed(2)+'px,0) rotateX('+(spr.rx+Math.cos(t*0.9)*0.35).toFixed(2)+'deg) rotateY('+(spr.ry+sway).toFixed(2)+'deg)';
  sheen.setAttribute('x',(90+spr.ry*14).toFixed(1));sheen.style.opacity=Math.min(1,Math.abs(spr.ry)/5+0.1);}
function rest(){resting=true;var t0=performance.now();(function loop(now){if(!resting)return;var t=(now-t0)/1000;floatStep(t);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);var sp=mob?22:28,cx=W/2,cy=LR.y+LR.h/2,maxd=Math.hypot(W,H)*0.6;
  ctx.fillStyle='rgba(95,103,99,1)';
  for(var y=sp/2;y<H;y+=sp)for(var x=sp/2;x<W;x+=sp){var dd=Math.hypot(x-cx,y-cy),fall=clamp01((dd-LR.w*0.42)/(maxd*0.5));if(fall<=0)continue;
    var w=RCI.reduced?0:Math.sin(dd*0.018-t*1.4)*1.6;ctx.globalAlpha=0.16*fall;ctx.fillRect(x-0.75,y-0.75+w,1.5,1.5);}
  ctx.globalAlpha=1;if(!RCI.reduced)requestAnimationFrame(loop);})(t0);}
function unfloat(){floatEl.style.transform='none';sheen.style.opacity=1;spr={rx:0,ry:0,tx:0,ty:0,vrx:0,vry:0,vtx:0,vty:0};}

function finish(){TL.id++;resting=false;frame(TOTAL);DEPTH.forEach(function(d){d.style.opacity=1;});document.body.classList.add('done');logoBox.style.opacity=1;
  WORD.forEach(function(k){G[k].forEach(function(g){g.style.opacity=1;g.style.transform='none';});});rest();}
function run(){P.ready=0;resting=false;unfloat();document.body.classList.remove('done');size();if(RCI.reduced){finish();return;}play(frame,TOTAL,finish);}
window.RCI_SEEK=function(t){TL.id++;resting=false;frame(t);};
document.getElementById('skip').addEventListener('click',function(){if(!resting)finish();});
var rp=document.getElementById('replay');if(rp)rp.addEventListener('click',run);
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&!resting)finish();});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){var was=resting;size();if(was){resting=false;finish();}},160);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(run);else run();
})();
</script>
